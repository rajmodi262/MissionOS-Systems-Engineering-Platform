<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MISSION OS — The Operating System for Space Missions. Systems Engineering for the Cosmos." />
  <meta name="theme-color" content="#050510" />
  <title>MISSION OS — Systems Engineering for the Cosmos</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Three-Layer Typography System -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <!-- Deep Space Particle Field — lives behind everything -->
  <canvas id="particle-field"></canvas>

  <!-- Nebula gradient overlay -->
  <div id="nebula-overlay"></div>

  <!-- CRT Scanline overlay for retro-future feel -->
  <div id="scanline-overlay"></div>

  <!-- Main Application Mount -->
  <div id="app"></div>

  <!-- Orion AI Copilot Trigger (persists across all views) -->
  <div id="orion-trigger"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
